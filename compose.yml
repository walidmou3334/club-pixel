name: pixel-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixel
      POSTGRES_USER: pixel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pixel-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixel -d pixel"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pixel-data:
